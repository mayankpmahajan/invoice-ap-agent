[project]
name = "zamp-invoice-ap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-ai-slim[openai]>=2.75.0",
    "pypdfium2>=5.15.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "reportlab>=5.1.2",
    "sqlalchemy[asyncio]>=2.1.9",
    "sse-starlette>=3.7.1",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
